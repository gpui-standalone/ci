name: test

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string

env:
  ROOT: gpui

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(gh release view --repo zed-industries/zed --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: zed-industries/zed
          ref: ${{ steps.pick.outputs.tag }}
          path: zed
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            libssl-dev libfontconfig1-dev pkg-config
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install tomlkit

      - name: Publish under throwaway namespace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          NS="zztmp$(openssl rand -hex 4)"
          echo "namespace: $NS"
          python3 scripts/standalone.py --zed zed --root "$ROOT" \
            --namespace "$NS" --version 0.0.0 --verify
