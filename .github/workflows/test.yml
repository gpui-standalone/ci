name: test

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string

env:
  ROOT: gpui

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(gh release view --repo zed-industries/zed --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: zed-industries/zed
          ref: ${{ needs.resolve.outputs.tag }}
          path: zed
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            libssl-dev libfontconfig1-dev pkg-config
      - run: pip install tomlkit
      - shell: bash
        run: |
          python3 scripts/standalone.py --zed zed --root "$ROOT" \
            --version "$VERSION" --local --out build
      - if: runner.os == 'Linux'
        run: cargo build --manifest-path "build/${ROOT}-standalone/Cargo.toml" --no-default-features --features wayland,x11 --examples
      - if: runner.os != 'Linux'
        shell: bash
        run: cargo build --manifest-path "build/${ROOT}-standalone/Cargo.toml" --examples
