name: mirror-sync

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string

permissions:
  contents: read

env:
  ORG: gpui-standalone
  ROOT: gpui

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(gh release view --repo zed-industries/zed --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: zed-industries/zed
          ref: ${{ steps.pick.outputs.tag }}
          path: zed
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install tomlkit
      - id: r
        run: |
          TAG="${{ steps.pick.outputs.tag }}"
          M=$(python3 scripts/standalone.py --zed zed --root "$ROOT" --list)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$M}" >> "$GITHUB_OUTPUT"

  push:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: zed-industries/zed
          ref: ${{ env.TAG }}
          path: zed
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install tomlkit

      - name: Generate manifest
        run: |
          python3 scripts/standalone.py --zed zed --root "$ROOT" \
            --version "$VERSION" --emit --out build

      - name: Sync upstream + main
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          set -e
          REPO="$ORG/${{ matrix.repo }}"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          gh repo view "$REPO" >/dev/null 2>&1 \
            || gh repo create "$REPO" --public \
                 --description "Standalone mirror of zed-industries/zed:${{ matrix.path }}"
          git config --global user.email ci@local
          git config --global user.name ci
          cd zed
          git remote add mirror "$URL"
          git fetch -q mirror 'refs/heads/upstream:refs/remotes/mirror/upstream' || true
          git fetch -q mirror 'refs/heads/main:refs/remotes/mirror/main' || true
          PREV=$(git rev-parse -q --verify refs/remotes/mirror/upstream || true)
          if [ -n "$PREV" ]; then
            NEW=$(git subtree split --prefix="${{ matrix.path }}" --onto="$PREV" -q)
          else
            NEW=$(git subtree split --prefix="${{ matrix.path }}" -q)
          fi
          git branch -f upstream "$NEW"
          if git rev-parse -q --verify refs/remotes/mirror/main >/dev/null; then
            git checkout -q -B main refs/remotes/mirror/main
            git merge --no-edit -m "chore: merge upstream $TAG" "$NEW" || true
          else
            git checkout -q -B main "$NEW"
          fi
          cp "../build/${{ matrix.dir }}/Cargo.toml" Cargo.toml
          git add -A
          git commit -qm "chore(release): $VERSION ($TAG)"
          git push mirror upstream:upstream main:main
